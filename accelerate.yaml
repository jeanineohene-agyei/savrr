# DeepSpeed ZeRO-2, bf16, WITHOUT CPU optimizer offload (OPSD default had it on):
# a 0.6B model + LoRA fits easily on an A100, and CPU offload needs DeepSpeed's
# CPU-Adam JIT build (fails when the system CUDA toolkit != torch's CUDA).
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  zero_stage: 2
  overlap_comm: true
  contiguous_gradients: true
  gradient_clip: 1
  gradient_accumulation_steps: 'auto'
distributed_type: DEEPSPEED
downcast_bf16: 'auto'
machine_rank: 0
main_training_function: main
mixed_precision: 'bf16'
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
